<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2330; --muted:#6b7280; --line:#dfe3ea; --edge:#b8c0cc;
  --accent:#2f6fed; --hl:#fff3b0; --sel:#2f6fed;
  --t-topic:#2f6fed; --t-direction:#8b5cf6; --t-process:#0ea5a4; --t-result:#16a34a; --t-open:#f59e0b; --t-artifact:#6b7280;
  --s-good:#16a34a; --s-bad:#dc2626; --s-warn:#f59e0b; --s-neutral:#6b7280; --s-active:#2f6fed;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1318; --panel:#171c23; --ink:#e6e9ef; --muted:#98a2b3; --line:#2a323d; --edge:#3a4453;
  --hl:#4a3f12; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#171c23; --ink:#e6e9ef; --muted:#98a2b3; --line:#2a323d; --edge:#3a4453;
  --hl:#4a3f12; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;overflow:hidden;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.tab{border:none;background:transparent;padding:6px 10px;border-bottom:2px solid transparent;border-radius:0;color:var(--muted)}
button.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
a{color:var(--accent)}
code{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;font-size:12.5px;background:rgba(127,127,127,.12);padding:1px 4px;border-radius:4px}
pre{background:rgba(127,127,127,.12);padding:8px 10px;border-radius:6px;overflow:auto;font-size:12.5px}
/* header */
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:700}
header .tabs{display:flex;gap:2px;border-right:1px solid var(--line);padding-right:8px;margin-right:4px}
header input[type=search]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;width:260px}
header .sp{flex:1}
header .meta{color:var(--muted);font-size:12px}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:5px;background:var(--panel)}
.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.off{opacity:.38}
.chip.gapchip{margin-left:6px;opacity:.6}
.chip.gapchip.on{opacity:1;border-color:var(--s-warn);background:color-mix(in srgb,var(--s-warn) 12%,transparent)}
#badge{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
#badge.hide{display:none}
.node .mk{position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%}
.node.isnew .mk{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.node.isupd .mk{background:var(--s-warn)}
.node .mk.sub{background:transparent;border:2px solid var(--accent);opacity:.65}
.rev{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--panel);overflow:hidden}
.rev>summary{list-style:none;cursor:pointer}
.rev>summary::-webkit-details-marker{display:none}
.rev h4{margin:0;padding:8px 12px;background:rgba(127,127,127,.08);font-size:13px;display:flex;gap:10px;align-items:baseline}
.rev h4::before{content:'▸';color:var(--muted);font-size:11px}
.rev[open] h4::before{content:'▾'}
.rev h4 .n{color:var(--muted);font-weight:400;font-size:12px}
.rev .body{padding:8px 12px}
.rev .grp{font-size:12px;color:var(--muted);margin:8px 0 4px}
.flip{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:13px;flex-wrap:wrap}
.flip .ar{color:var(--muted)}
.chgline{font-size:13px;padding:3px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.chgline .what{color:var(--muted);font-size:12px}
.seen{margin:6px 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.upd{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px;background:var(--panel)}
.upd h3{margin:0 0 4px;font-size:13px;border:0;padding:0;color:var(--ink);text-transform:none;letter-spacing:0}
.upd .hint{color:var(--muted);font-size:12px;margin-bottom:8px}
.upd .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.upd button[disabled]{opacity:.45;cursor:default}
.upd .spin{color:var(--accent);font-size:12px}
.upd pre{margin:10px 0 0;max-height:280px;overflow:auto;font-size:12px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.upd pre:empty{display:none}
.pbtns{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
.pbtns button{font-size:12px;padding:3px 9px}
.fixform{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 14px;background:rgba(127,127,127,.06)}
.fixform h3{margin:0 0 4px;border:0;padding:0;text-transform:none;letter-spacing:0;color:var(--ink)}
.fixform .hint{color:var(--muted);font-size:12px;margin-bottom:8px}
.fixform label{display:block;font-size:12px;color:var(--muted);margin:8px 0 2px}
.fixform input,.fixform textarea,.fixform select{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.fixform .btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.fixform button[disabled]{opacity:.45;cursor:default}
.fixform .spin{color:var(--accent);font-size:12px}
.fixform pre{margin:8px 0 0;max-height:220px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-word}
.fixform pre:empty{display:none}
.since{border:1px solid var(--accent);border-radius:8px;padding:10px 14px;margin-bottom:14px;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.since h3{margin:0 0 6px;font-size:13px;color:var(--accent);border:0;padding:0}
/* main */
main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;position:relative;overflow:hidden;cursor:grab;background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1px) 0 0/24px 24px}
#stage.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke:var(--edge);stroke-width:1.6}
#edges path.hl{stroke:var(--accent);stroke-width:2.2}
.node{position:absolute;width:230px;min-height:48px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--t-topic);border-radius:8px;padding:6px 26px 6px 10px;box-shadow:var(--shadow);cursor:pointer;user-select:none}
.node:hover{border-color:var(--accent);border-left-color:var(--tc)}
.node.sel{outline:2px solid var(--sel);outline-offset:1px}
.node.match{background:var(--hl)}
.node.dim{opacity:.35}
.node .t{font-weight:600;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .m{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:3px;white-space:nowrap;overflow:hidden}
.node .st{display:inline-flex;align-items:center;gap:4px}
.node .st i{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--sc)}
.node .tg{position:absolute;right:-13px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.node .tg:hover{border-color:var(--accent);color:var(--accent)}
.node.root{border-left-width:4px;background:var(--accent);color:#fff;border-color:var(--accent)}
.node.root .m{color:rgba(255,255,255,.8)}
.node.root .t{font-size:14px}
.node .k{position:absolute;left:10px;top:-9px;font-size:10px;padding:0 6px;border-radius:999px;background:var(--tc);color:#fff;line-height:16px}
#zoom{position:absolute;left:12px;bottom:12px;display:flex;gap:4px}
#zoom button{width:32px;padding:4px 0}
#legend{position:absolute;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;max-width:420px}
#legend span{display:inline-flex;gap:4px;align-items:center}
#legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* panel */
#panel{width:420px;max-width:50vw;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 18px 40px;display:none}
#panel.on{display:block}
#panel .crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
#panel .crumb a{color:var(--muted);text-decoration:none}
#panel .crumb a:hover{color:var(--accent)}
#panel h2{font-size:18px;margin:2px 0 8px;line-height:1.3}
#panel .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-size:12px}
.badge{border-radius:999px;padding:1px 9px;color:#fff;background:var(--muted)}
#panel h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
#panel .summary{font-size:14px}
#panel .detail p{margin:6px 0}
#panel .detail ul{margin:4px 0;padding-left:20px}
#panel .detail h4{font-size:13px;margin:12px 0 4px}
#panel ul.plain{padding-left:18px;margin:4px 0}
#panel ul.plain li{margin:3px 0}
#panel .src{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
#panel .src .kind{font-size:10px;padding:0 6px;border-radius:4px;background:rgba(127,127,127,.15);color:var(--muted);flex:none;line-height:18px;margin-top:2px}
#panel .src .note{color:var(--muted);font-size:12px}
#panel .src .cp{font-size:11px;padding:0 6px;margin-left:auto;flex:none}
.rel{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:6px;border:1px solid var(--line);cursor:pointer;font-size:12.5px;border-left:3px solid var(--tc)}
.rel:hover{border-color:var(--accent)}
#panel .close{float:right}
/* list views */
#list{flex:1;overflow:auto;padding:16px 22px;display:none}
#list.on{display:block}
.tl-month{font-weight:700;margin:18px 0 6px;color:var(--muted);font-size:12px;letter-spacing:.05em}
.tl-row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);align-items:start}
.tl-row .d{color:var(--muted);font-size:12px;white-space:nowrap}
.tl-row .c{cursor:pointer}
.tl-row .c b{border-left:3px solid var(--tc);padding-left:6px}
.tl-row .c .s{color:var(--muted);font-size:12.5px;margin-top:2px}
.gantt{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:18px}
.gantt .axis{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.gantt .axis div{flex:none;font-size:11px;color:var(--muted);padding:3px 4px;border-right:1px solid var(--line)}
.gantt .grp{font-size:12px;font-weight:700;padding:6px 8px 2px;color:var(--muted)}
.gantt .bar-row{height:22px;position:relative}
.gantt .bar{position:absolute;top:3px;height:16px;border-radius:4px;background:var(--tc);color:#fff;font-size:11px;line-height:16px;padding:0 6px;white-space:nowrap;overflow:hidden;cursor:pointer;opacity:.9}
.gantt .bar:hover{opacity:1;outline:2px solid var(--ink)}
.gantt .bar.out{padding:0;overflow:visible}
.gantt .bar.out .lbl{position:absolute;left:100%;margin-left:6px;color:var(--ink);white-space:nowrap;font-size:11px}
.open-card{border:1px solid var(--line);border-left:4px solid var(--t-open);border-radius:8px;padding:10px 14px;margin:8px 0;background:var(--panel);cursor:pointer}
.open-card:hover{border-color:var(--accent);border-left-color:var(--t-open)}
.open-card .p{font-size:12px;color:var(--muted)}
.qsec{margin:14px 0 6px;font-size:12px;color:var(--muted);letter-spacing:.04em;display:flex;gap:8px;align-items:baseline}
.qsec b{color:var(--ink);font-size:13px;letter-spacing:0}
.q{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:8px 12px;border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:8px;margin:6px 0;background:var(--panel)}
.q .t{font-size:13.5px}
.q .m{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.q .tag,#panel .tag{border-radius:999px;padding:1px 8px;font-size:11px;border:1px solid var(--line);white-space:nowrap}
.q .tag.due,#panel .tag.due{border-color:var(--s-warn);color:var(--s-warn)}
.q .tag.due.soon{background:var(--s-warn);color:#fff}
.q .tag.eff,#panel .tag.eff{border-color:var(--line);color:var(--muted)}
.q .why{font-style:italic}
.q.blocked{opacity:.72;border-left-style:dashed}
details.unsorted>summary{list-style:none;cursor:pointer}
details.unsorted>summary::-webkit-details-marker{display:none}
details.unsorted>summary .qsec::before{content:'▸';color:var(--muted)}
details.unsorted[open]>summary .qsec::before{content:'▾'}
.q .blk{color:var(--s-bad)}
.open-card ul{margin:4px 0 0;padding-left:18px;font-size:13px}
table.sess{border-collapse:collapse;width:100%;font-size:13px}
table.sess th,table.sess td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.sess th{color:var(--muted);font-size:12px;font-weight:600}
table.sess td.n{white-space:nowrap;color:var(--muted)}
table.sess tr.ex td{opacity:.55}
.exbadge{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);white-space:nowrap}
.empty{color:var(--muted);padding:40px;text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:800px){#panel{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:100%} header input[type=search]{width:160px}}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="tabs">
    <button class="tab on" data-view="map"></button>
    <button class="tab" data-view="timeline"></button>
    <button class="tab" data-view="open"></button>
    <button class="tab" data-view="sessions"></button>
    <button class="tab" data-view="changes"></button>
  </div>
  <input type="search" id="q">
  <div class="chips" id="typeChips"></div>
  <div class="chips" id="statusChips"></div>
  <button id="badge" class="hide"></button>
  <span class="sp"></span>
  <button id="expandAll"></button>
  <button id="collapseAll"></button>
  <button id="fit"></button>
  <span class="meta" id="meta"></span>
</header>
<main>
  <div id="stage">
    <div id="world"><svg id="edges"></svg><div id="nodes"></div></div>
    <div id="zoom"><button data-z="1">＋</button><button data-z="-1">－</button></div>
    <div id="legend"></div>
  </div>
  <div id="list"></div>
  <aside id="panel"></aside>
</main>
<div id="toast"></div>
<script>

const L = STR[(D.lang==='en')?'en':'ko'];

const TYPES = L.type;
const SEV = {ongoing:'active',done:'good',confirmed:'good',refuted:'bad',withdrawn:'bad',
  inconclusive:'warn',abandoned:'neutral',open:'warn',blocked:'bad',planned:'neutral'};
const STATUS = {}; Object.keys(SEV).forEach(k=>STATUS[k]=[L.stat[k],SEV[k]]);
const SC = {good:'var(--s-good)',bad:'var(--s-bad)',warn:'var(--s-warn)',neutral:'var(--s-neutral)',active:'var(--s-active)'};
const nodes = D.map.nodes.slice();
const byId = {}; nodes.forEach(n=>{ byId[n.id]=n; n.children=[]; });
const ROOT = {id:'__root', title:D.map.title||L.mapTitle, type:'topic', status:'ongoing', summary:D.map.summary||'', children:[], root:true};
byId[ROOT.id]=ROOT;
nodes.forEach(n=>{ const p = n.parent && byId[n.parent] ? byId[n.parent] : ROOT; n.parentNode=p; p.children.push(n); });
const sortKey = n => [n.order==null?1e9:n.order, (n.period&&n.period.start)||'9999', n.title];
function sortRec(n){ n.children.sort((a,b)=>{const x=sortKey(a),y=sortKey(b); for(let i=0;i<3;i++){ if(x[i]<y[i])return -1; if(x[i]>y[i])return 1;} return 0;}); n.children.forEach(sortRec);} sortRec(ROOT);
function depth(n){let d=0; while(n.parentNode){d++; n=n.parentNode;} return d;}
nodes.forEach(n=>n.depth=depth(n));
const sessions = D.sessions||[]; const sessById={}; sessions.forEach(s=>sessById[s.sessionId]=s);
const nodeBySession={}; nodes.forEach(n=>(n.sources||[]).forEach(s=>{ if(s.kind==='session'){ (nodeBySession[s.ref]=nodeBySession[s.ref]||[]).push(n);} }));

// ---- state
let store={}; try{ store=JSON.parse(localStorage.getItem('rm:'+(D.mapName||D.map.title||''))||'{}'); }catch(e){}
const collapsed = new Set(store.collapsed || nodes.filter(n=>n.depth>=1 && n.children.length).map(n=>n.id));
let view = 'map', selected = null, query='', typeOff=new Set(), statusOff=new Set();
const SRV = window.RM_SERVE || null;
const REVS = D.revisions||[]; const CUR_REV = REVS.length ? REVS[REVS.length-1].rev : 0;
let jobSeen = 0, jobTimer = null;
function srvUrl(p){ return p + (p.indexOf('?')<0?'?':'&') + 't=' + encodeURIComponent(SRV.token); }
let LOG_EL='updlog';
function srvLog(t, append){ const el=document.getElementById(LOG_EL); if(!el) return;
  if(append) el.textContent += (el.textContent?'\n':'') + t; else el.textContent = t;
  el.scrollTop = el.scrollHeight; }
function srvBusy(on, what){
  ['btnscan','btnrun','fxsave','fxagent'].forEach(id=>{ const b=document.getElementById(id); if(b) b.disabled=on; });
  const sp=document.getElementById(LOG_EL==='fxlog'?'fxspin':'updspin'); if(sp) sp.textContent = on ? (what+' '+L.updRunning) : '';
}
// node-panel corrections: direct field edit (free) or an instruction for the agent (tokens)
function fixSend(path, body){
  LOG_EL='fxlog'; jobSeen=0; srvLog(''); srvBusy(true, '');
  fetch(srvUrl(path), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}).then(r=>r.json()).then(j=>{
    if(j.error){ srvBusy(false,''); srvLog(j.error); return; }
    if(!j.started){ srvBusy(false,''); srvLog(L.fixBusy); return; }
    if(j.applied) srvLog(j.applied);
    srvPoll(()=>{ srvLog('— '+L.fixSaved, true); setTimeout(()=>location.reload(), 900); });
  }).catch(e=>{ srvBusy(false,''); srvLog('요청 실패: '+e); });
}
function fixForm(n){
  const box=document.getElementById('fixbox'); if(!box) return;

  const ag=SRV&&SRV.agent;

    <label>status<select id="fxstatus">${opts}</select></label>
    <label>${L.fixTitleF}<input id="fxtitle" value="${esc(n.title)}"></label>
    <label>${L.fixSummary}<textarea id="fxsummary" rows="4">${esc(n.summary||'')}</textarea></label>
    <label>${L.fixWhy}<input id="fxwhy"></label>
    <div class="btns"><button class="primary" id="fxsave">${L.fixSave}</button><span class="spin" id="fxspin"></span></div>
    <label>${L.fixAgent}<textarea id="fxtext" rows="3" placeholder="${esc(L.fixAgentPh)}"></textarea></label>
    <div class="btns"><button id="fxagent"${ag?'':' disabled'}>${L.fixAgent}${ag?' ('+esc(ag)+')':''}</button>${ag?'':`<span class="hint">${L.fixNoAgent}</span>`}</div>
    <pre id="fxlog"></pre></div>`;
  document.getElementById('fxsave').onclick=()=>fixSend('/api/edit',{id:n.id,
    status:document.getElementById('fxstatus').value, title:document.getElementById('fxtitle').value,
    summary:document.getElementById('fxsummary').value, why:document.getElementById('fxwhy').value});
  document.getElementById('fxagent').onclick=()=>{ const t=document.getElementById('fxtext').value.trim(); if(t) fixSend('/api/correct',{id:n.id,text:t}); };
}
// ---- markdown export (same fields and order as scripts/rmexport.py)
const EN = D.lang==='en';
function mdNext(x){ if(typeof x==='string') return x; const b=[x.text||'']; if(x.due) b.push('(기한 '+x.due+')'); if(x.blockedBy&&x.blockedBy.length) b.push('— 막힘: '+x.blockedBy.map(i=>byId[i]?byId[i].title:i).join(', ')); return b.join(' '); }
function mdSrc(s){ if(s.kind==='session') return '세션 '+(s.ref||'').slice(0,8); if(s.kind==='url') return '['+(s.label||s.ref)+']('+s.ref+')'; return s.label ? s.label+' `'+s.ref+'`' : '`'+s.ref+'`'; }
function mdNode(n, depth, heading){
  const st=(STATUS[n.status]||[n.status])[0], ty=TYPES[n.type]||n.type, h='#'.repeat(Math.min(6,depth+1));
  const o=(heading===false?[]:[h+' '+n.title]).concat(['*'+ty+' · '+st+(per(n)?' · '+per(n):'')+'*', '']);
  if(n.summary) o.push(n.summary,'');
  if(n.evidence&&n.evidence.length){ o.push(EN?'**Evidence**':'**근거·수치**'); n.evidence.forEach(e=>o.push('- '+e)); o.push(''); }
  if(n.detail) o.push(n.detail.trim(),'');
  if(n.next&&n.next.length){ o.push(EN?'**Next**':'**더 파볼 것**'); n.next.forEach(x=>o.push('- '+mdNext(x))); o.push(''); }
  if(n.sources&&n.sources.length) o.push((EN?'Sources: ':'출처: ')+n.sources.map(mdSrc).join(' · '),'');
  n.children.forEach(c=>o.push(...mdNode(c, depth+1)));
  return o;
}
function mdTree(root){
  const today=new Date().toISOString().slice(0,10);
  const o=['# '+(root.root?(D.map.title||L.mapTitle):root.title), '', '_'+(D.map.updatedAt||'')+' · '+today+'_', ''];
  if(root.root){ if(D.map.summary) o.push(D.map.summary,''); root.children.forEach(c=>o.push(...mdNode(c,1))); }
  else o.push(...mdNode(root,0,false));
  return o.join('\n').replace(/\n+$/,'')+'\n';
}
function mdChecklist(){
  const today=new Date().toISOString().slice(0,10);
  const dead=nodes.filter(n=>['withdrawn','refuted','abandoned'].includes(n.status)).sort((a,b)=>a.status<b.status?-1:a.status>b.status?1:0);
  const cond=nodes.filter(n=>n.status==='inconclusive');
  const o=['# '+(D.map.title||L.mapTitle)+(EN?' — do-not-cite checklist':' — 철회 수치 체크리스트'), '', '_'+today+'_', '',
    EN?'Every number below sits on a withdrawn, refuted or abandoned node. Tick each one as you confirm it is absent from the manuscript.'
      :'아래 수치는 전부 철회·반증·중단된 노드에 있는 값이다. 원고에 없음을 확인하면서 하나씩 체크한다.', ''];
  dead.forEach(n=>{ o.push('## ❌ '+n.title+'  *('+(STATUS[n.status]||[n.status])[0]+')*', '_'+pathOf(n).slice(0,-1).map(a=>a.title).join(' › ')+'_', '');
    if(n.summary) o.push('- [ ] '+n.summary); (n.evidence||[]).forEach(e=>o.push('- [ ] '+e)); o.push(''); });
  if(cond.length){ o.push('## ⚠ '+(EN?'Conditional (inconclusive) — cite only with the caveat':'조건부 (미결) — 단서 없이 인용 금지'), '');
    cond.forEach(n=>o.push('- [ ] **'+n.title+'** — '+(n.summary||''))); o.push(''); }
  return o.join('\n').replace(/\n+$/,'')+'\n';
}
function download(name, text){ const b=new Blob([text],{type:'text/markdown;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function exportPanelHtml(){ return `<div class="upd"><h3>${L.exportTitle}</h3><div class="hint">${L.exportHint}</div>
  <div class="btns"><button id="expall">⬇ ${L.exportAll}</button><button id="expchk">⬇ ${L.exportChk}</button></div></div>`; }
function bindExport(){ const mn=(D.mapName||'map'); const a=document.getElementById('expall'), c=document.getElementById('expchk');
  if(a) a.onclick=()=>download(mn+'-all.md', mdTree(ROOT)); if(c) c.onclick=()=>download(mn+'-checklist.md', mdChecklist()); }
function srvPoll(after){
  clearTimeout(jobTimer);
  jobTimer = setTimeout(()=>{ fetch(srvUrl('/api/job?since='+jobSeen)).then(r=>r.json()).then(j=>{
    if(j.lines && j.lines.length){ jobSeen = j.total; srvLog(j.lines.join('\n'), true); }
    if(!j.done){ srvPoll(after); return; }
    srvBusy(false,'');
    if(j.rc!==0) srvLog('— '+L.updFail, true); else if(after) after();
  }).catch(()=>{ srvBusy(false,''); srvLog('— 서버와 끊겼습니다', true); }); }, 600);
}
function srvRun(path, label, after){
  LOG_EL='updlog'; jobSeen = 0; srvLog(''); srvBusy(true, label);
  fetch(srvUrl(path), {method:'POST'}).then(r=>r.json()).then(j=>{
    if(!j.started){ srvBusy(false,''); srvLog('다른 작업이 아직 돌고 있습니다.'); return; }
    srvPoll(after);
  }).catch(e=>{ srvBusy(false,''); srvLog('요청 실패: '+e); });
}
let seenRev = (store.seenRev==null) ? 0 : store.seenRev;
function since(rev){
  const add=new Set(), chg=new Set(), flips=[], gone=[];
  REVS.forEach(r=>{ if(r.rev<=rev||r.baseline) return;
    (r.added||[]).forEach(i=>add.add(i));
    (r.removed||[]).forEach(i=>gone.push(i));
    (r.changed||[]).forEach(c=>{ chg.add(c.id);
      if(c.fields && c.fields.status) flips.push({id:c.id, from:c.fields.status[0], to:c.fields.status[1], rev:r.rev}); });
  });
  chg.forEach(i=>{ if(add.has(i)) chg.delete(i); });
  return {add, chg, flips, gone};
}
let tx=40, ty=40, scale=1;
function save(){ try{ localStorage.setItem('rm:'+(D.mapName||D.map.title||''), JSON.stringify({collapsed:[...collapsed], selected, tx,ty,scale, seenRev})); }catch(e){} }
if(store.tx!=null){tx=store.tx;ty=store.ty;scale=store.scale||1;}

// ---- helpers
function resumeFor(ss, id){ const k=(ss&&ss.source)||'claude-code'; const pre=(D.resumeCmd||{})[k]; return pre==null? ('claude --resume '+id) : (pre? pre+id : ''); }
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(src){ // tiny markdown: headings, bullets, paragraphs, bold, code, links
  const out=[]; let ul=false; const inl = t => esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  (src||'').split(/\r?\n/).forEach(line=>{
    const m=line.match(/^(#{1,4})\s+(.*)/); const b=line.match(/^\s*[-*]\s+(.*)/);
    if(b){ if(!ul){out.push('<ul>');ul=true;} out.push('<li>'+inl(b[1])+'</li>'); return; }
    if(ul){out.push('</ul>');ul=false;}
    if(m){ out.push('<h4>'+inl(m[2])+'</h4>'); return; }
    if(line.trim()) out.push('<p>'+inl(line)+'</p>');
  }); if(ul)out.push('</ul>'); return out.join('');
}
const fileUrl = p => { if(/^https?:/.test(p)) return p; let q=p.replace(/\\/g,'/'); if(!q.startsWith('/')) q='/'+q; return 'file://'+q.split('/').map(s=>encodeURIComponent(s)).join('/').replace(/%3A/g,':'); };
const per = n => n.period ? (n.period.start||'') + (n.period.end && n.period.end!==n.period.start ? ' → '+n.period.end : '') : '';
function toast(t){ const e=document.getElementById('toast'); e.textContent=t; e.classList.add('on'); setTimeout(()=>e.classList.remove('on'),1400); }
function copy(t){ navigator.clipboard && navigator.clipboard.writeText(t).then(()=>toast(L.copied+t)).catch(()=>toast(L.copyFail)); }
window.rmCopy = copy;
function matches(n){ if(!query) return false; const q=query.toLowerCase(); const hay=[n.title,n.summary,n.detail,(n.evidence||[]).join(' '),(n.next||[]).join(' '),(n.tags||[]).join(' ')].join('\n').toLowerCase(); return hay.includes(q); }
function passFilter(n){ return !typeOff.has(n.type) && !statusOff.has(n.status); }
function pathOf(n){ const p=[]; while(n && !n.root){p.unshift(n); n=n.parentNode;} return p; }
function expandTo(n){ pathOf(n).forEach(a=>collapsed.delete(a.id)); }

// ---- layout
const W=230, ROW=64, COL=300;
function layout(){
  const vis=[];
  function h(n){ n._vis = !collapsed.has(n.id); const kids = n._vis ? n.children : []; n._h = kids.length ? kids.reduce((s,k)=>s+h(k),0) : 1; return n._h; }
  h(ROOT);
  function place(n, d, y0){ n._x = d*COL; n._y = y0 + n._h*ROW/2 - 24; vis.push(n); if(!n._vis) return; let y=y0; n.children.forEach(k=>{ place(k,d+1,y); y+=k._h*ROW; }); }
  place(ROOT,0,0);
  return vis;
}
let SEEN = {add:new Set(),chg:new Set(),flips:[],gone:[]};
let SUB = new Set();                       // node has a changed descendant
let focusChanged = false;  // after 'expand changed': keep the eye on what moved
const GAPS = D.gaps||{}; let gapsOn = false;
function rollUp(){
  SUB = new Set();
  const touched = new Set([...SEEN.add, ...SEEN.chg]);
  touched.forEach(id=>{ let n=byId[id]; while(n && n.parentNode){ n=n.parentNode; if(!n.root) SUB.add(n.id); } });
}
function expandChanged(){
  nodes.forEach(n=>{ if(n.depth>=1 && n.children.length) collapsed.add(n.id); });
  [...SEEN.add, ...SEEN.chg].forEach(id=>{ const n=byId[id]; if(n) expandTo(n); });
  focusChanged = true; save();
}
function clearFocus(){ if(focusChanged){ focusChanged=false; return true; } return false; }
function renderMap(){
  const vis = layout();
  const world=document.getElementById('world'), svg=document.getElementById('edges'), box=document.getElementById('nodes');
  const maxX=Math.max(...vis.map(n=>n._x))+W+60, maxY=Math.max(...vis.map(n=>n._y))+80;
  svg.setAttribute('width',maxX); svg.setAttribute('height',maxY);
  const anyMatch = query && vis.some(matches);
  const selPath = selected ? new Set(pathOf(byId[selected]).map(n=>n.id)) : new Set();
  let paths='';
  vis.forEach(n=>{ if(n.root) return; const p=n.parentNode; const x1=p._x+W, y1=p._y+24, x2=n._x, y2=n._y+24; const mx=(x1+x2)/2; const hl = selPath.has(n.id)?' class="hl"':''; paths+=`<path${hl} d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`; });
  svg.innerHTML=paths;
  box.innerHTML = vis.map(n=>{
    const st=STATUS[n.status]||[n.status,'neutral']; const tc=`var(--t-${n.type})`;
    const cls=['node']; if(n.root)cls.push('root'); if(SEEN.add.has(n.id))cls.push('isnew'); else if(SEEN.chg.has(n.id))cls.push('isupd'); if(n.id===selected)cls.push('sel'); const onChange = SEEN.add.has(n.id)||SEEN.chg.has(n.id)||SUB.has(n.id);
    if(matches(n))cls.push('match'); else if((anyMatch && !selPath.has(n.id)) || !passFilter(n) || (focusChanged && !n.root && !onChange) || (gapsOn && !n.root && !GAPS[n.id])) cls.push('dim');
    const tg = n.children.length ? `<span class="tg" data-tg="${n.id}" title="${n._vis?L.collapse:L.expand}">${n._vis?'−':n.children.length}</span>` : '';
    const kind = n.root||n.type==='topic' ? '' : `<span class="k">${TYPES[n.type]||n.type}</span>`;
    const meta = n.root ? `<span>${L.nNodes(nodes.length)} · ${D.generatedAt||''}</span>` : `<span class="st"><i></i>${st[0]}</span><span>${esc(per(n))}</span>`;
    const own = SEEN.add.has(n.id)||SEEN.chg.has(n.id);
    const mk = own ? '<span class="mk"></span>' : ((!n._vis && SUB.has(n.id)) ? '<span class="mk sub"></span>' : '');
    return `<div class="${cls.join(' ')}" data-id="${n.id}" style="left:${n._x}px;top:${n._y}px;--tc:${tc};--sc:${SC[st[1]]};border-left-color:${tc}" title="${esc(n.summary||'')}">${mk}${kind}<div class="t">${esc(n.title)}</div><div class="m">${meta}</div>${tg}</div>`;
  }).join('');
  world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
}
function fit(){ const vis=layout(); const st=document.getElementById('stage').getBoundingClientRect(); const maxX=Math.max(...vis.map(n=>n._x))+W+40, maxY=Math.max(...vis.map(n=>n._y))+80; scale=Math.min(1, (st.width-40)/maxX, (st.height-40)/maxY); scale=Math.max(scale,.4); tx=20; ty=Math.max(20,(st.height-maxY*scale)/2); renderAll(); save(); }
function centerOn(n){ const st=document.getElementById('stage').getBoundingClientRect(); tx = st.width/2 - (n._x+W/2)*scale; ty = st.height/2 - (n._y+24)*scale; }

// ---- panel
function select(id, opts){ opts=opts||{}; selected=id; const n=byId[id]; if(!n){renderPanel();return;} if(view!=='map' && opts.goMap){ setView('map'); } expandTo(n); if(opts.center){ layout(); centerOn(n);} renderAll(); location.hash='node='+encodeURIComponent(id); save(); }

function srcRow(s){
  const label = esc(s.label || (s.kind==='session' ? L.session+' '+s.ref.slice(0,8) : s.ref.split(/[\\/]/).pop()));
  let body='';
  if(s.kind==='session'){ const ss=sessById[s.ref]; const cmd=resumeFor(ss,s.ref); const dig = ss && ss.digest ? ` · <a href="${fileUrl(ss.digest)}" target="_blank">digest</a>` : ''; const when = ss? ` <span class="note">${ss.start.slice(0,10)}~${ss.end.slice(0,10)} · ${L.nPrompts(ss.userPrompts)}${ss.source&&ss.source!=='claude-code'?' · '+ss.source:''}</span>`:''; body=`<div><b>${label}</b>${when}${s.note?`<div class="note">${esc(s.note)}</div>`:''}<div class="note">${cmd?`<code>${cmd}</code> · `:''}${dig.replace(/^ · /,'')}</div></div>${cmd?`<button class="cp" onclick="rmCopy('${cmd}')">${L.copy}</button>`:''}`; }
  else if(s.kind==='memory'){ const p=s.path||s.ref; body=`<div><a href="${fileUrl(p)}" target="_blank">${label}</a>${s.note?`<div class="note">${esc(s.note)}</div>`:''}</div><button class="cp" onclick="rmCopy('${esc(p).replace(/\\/g,'\\\\')}')">${L.path}</button>`; }
  else { body=`<div><a href="${fileUrl(s.ref)}" target="_blank" title="${esc(s.ref)}">${label}</a>${s.note?`<div class="note">${esc(s.note)}</div>`:''}</div>${/^https?:/.test(s.ref)?'':`<button class="cp" onclick="rmCopy('${esc(s.ref).replace(/\\/g,'\\\\')}')">${L.path}</button>`}`; }
  return `<div class="src"><span class="kind">${s.kind}</span>${body}</div>`;

function relChip(n){ return `<span class="rel" style="--tc:var(--t-${n.type})" onclick="rmSelect('${n.id}')">${esc(n.title)}</span>`; }

  <div class="summary">${esc(n.summary||'')}</div>
  <div class="pbtns"><button class="cp" id="pexport">⬇ ${L.exportSub}</button>${SRV?`<button class="cp" id="pfix">✎ ${L.fix}</button>`:''}</div><div id="fixbox"></div>`;
  const gp=GAPS[n.id]||[];
  if(gp.length) h+=`<h3>${L.gapTitle}</h3><div class="badges">${gp.map(k=>`<span class="badge" style="background:var(--s-warn)">${L.gap[k]||k}</span>`).join('')}</div>`;

  const nx=(D.next||{})[n.id]||[];

    if(e.effort) bits.push(`<span class="tag eff">${esc((L.effort||{})[e.effort]||e.effort)}</span>`);

// ---- list views
function renderList(){
  const el=document.getElementById('list'); if(view==='map'){el.classList.remove('on');return;} el.classList.add('on');
  const vis = nodes.filter(n=>passFilter(n) && (!query||matches(n)));
  if(view==='timeline'){
    const dated = vis.filter(n=>n.period&&n.period.start).sort((a,b)=>a.period.start<b.period.start?-1:1);
    if(!dated.length){el.innerHTML='<div class="empty">'+L.noDates+'</div>';return;}
    // gantt by top-level topic
    const min=dated[0].period.start, max=dated.reduce((m,n)=>{const e=n.period.end||n.period.start; return e>m?e:m;}, min);
    const d0=new Date(min), d1=new Date(max); d1.setDate(d1.getDate()+7); const days=Math.max(30,Math.round((d1-d0)/864e5)); const PX=14;
    let axis=''; for(let d=new Date(d0.getFullYear(),d0.getMonth(),1); d<=d1; d.setMonth(d.getMonth()+1)){ const a=Math.max(d,d0), b=new Date(d.getFullYear(),d.getMonth()+1,1); const w=Math.round((Math.min(b,d1)-a)/864e5)*PX; if(w>0) axis+=`<div style="width:${w}px">${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}</div>`; }
    const groups={}; dated.forEach(n=>{ const top=pathOf(n)[0]; (groups[top.id]=groups[top.id]||[]).push(n); });
    let g=`<div class="gantt"><div class="axis">${axis}</div>`;
    Object.keys(groups).forEach(tid=>{ g+=`<div class="grp">${esc(byId[tid].title)}</div>`; groups[tid].forEach(n=>{ const s=Math.round((new Date(n.period.start)-d0)/864e5)*PX; const e=Math.max(PX*2, Math.round((new Date(n.period.end||n.period.start)-d0)/864e5)*PX - s + PX); const wide=e>=esc(n.title).length*7+14; g+=`<div class="bar-row" style="width:${days*PX+320}px"><div class="bar${wide?'':' out'}" style="left:${s}px;width:${e}px;--tc:var(--t-${n.type})" onclick="rmSelect('${n.id}')" title="${esc(n.title)} — ${esc(n.summary||'')}">${wide?esc(n.title):`<span class="lbl">${esc(n.title)}</span>`}</div></div>`; }); });
    g+='</div>';
    let rows='', month='';
    dated.forEach(n=>{ const m=n.period.start.slice(0,7); if(m!==month){month=m; rows+=`<div class="tl-month">${m}</div>`;} const st=STATUS[n.status]||[n.status]; rows+=`<div class="tl-row"><div class="d">${esc(per(n))}<br><span style="color:var(--t-${n.type})">${TYPES[n.type]}</span> · ${st[0]}</div><div class="c" onclick="rmSelect('${n.id}')" style="--tc:var(--t-${n.type})"><b>${esc(n.title)}</b><div class="s">${esc(n.summary||'')}</div></div></div>`; });
    el.innerHTML=g+rows;
  } else if(view==='open'){
    const NX = D.next||{};
    const rank = {quick:0, day:1, long:2};
    const today = new Date().toISOString().slice(0,10);
    const rows=[], waiting=[], bare=[];
    vis.forEach(n=>{
      const items = NX[n.id]||[];
      items.forEach(it=>{
        const r = {node:n, it, top:pathOf(n)[0]};
        (it.blockedBy && it.blockedBy.length ? waiting : rows).push(r);
      });
      if(!items.length && (n.type==='open' || ['blocked','planned'].includes(n.status))) bare.push(n);
    });
    if(!rows.length && !waiting.length && !bare.length){ el.innerHTML='<div class="empty">'+L.noOpen+'</div>'; return; }
    const key = r => [ r.it.due || '9999-99-99',
                       String(rank[r.it.effort] != null ? rank[r.it.effort] : 3),
                       (r.node.period && r.node.period.end) ? r.node.period.end.split('').reverse().join('') : '' ].join('|');
    rows.sort((a,b)=> key(a)<key(b) ? -1 : key(a)>key(b) ? 1 : 0);
    waiting.sort((a,b)=> key(a)<key(b) ? -1 : 1);
    const tagDue = d => { if(!d) return ''; const cls = d<today ? 'due soon' : (d<=today ? 'due soon' : 'due');
      const lbl = d<today ? L.qOver : (d===today ? L.qToday : d);
      return `<span class="tag ${cls}">${L.qDue} ${lbl}</span>`; };
    const tagEff = e => e ? `<span class="tag eff">${(L.effort||{})[e]||e}</span>` : '';
    const blk = it => (it.blockedBy||[]).map(b=> byId[b] ? relChip(byId[b]) : `<span class="blk">${esc(b)}</span>`).join(' ');
    const row = (r, isBlocked) => `<div class="q${isBlocked?' blocked':''}" style="--tc:var(--t-${r.node.type})">
      <div class="t">${esc(r.it.text)}</div><div>${tagDue(r.it.due)}${tagEff(r.it.effort)}</div>
      <div class="m">${relChip(r.node)}<span>${esc(r.top.title)}</span>
      ${r.it.why?`<span class="why">${esc(r.it.why)}</span>`:''}
      ${isBlocked?`<span>${L.qBlockedBy}</span>${blk(r.it)}`:''}</div></div>`;
    const sorted = rows.filter(r=>r.it.due||r.it.effort);
    const unsorted = rows.filter(r=>!(r.it.due||r.it.effort));
    let h='';
    if(sorted.length) h += `<div class="qsec"><b>${L.qDoNow}</b><span>${sorted.length}</span></div>` + sorted.map(r=>row(r,false)).join('');
    if(waiting.length) h += `<div class="qsec"><b>${L.qWaiting}</b><span>${waiting.length}</span></div>` + waiting.map(r=>row(r,true)).join('');
    if(unsorted.length) h += `<details class="unsorted"><summary><div class="qsec"><b>${L.qUnsorted}</b><span>${unsorted.length}</span></div></summary>`
      + unsorted.map(r=>row(r,false)).join('') + `</details>`;
    if(bare.length) h += `<div class="qsec"><b>${L.qNoNext}</b><span>${bare.length}</span></div>`
      + bare.map(n=>`<div class="q" style="--tc:var(--t-${n.type})"><div class="t">${esc(n.title)}</div><div></div>
        <div class="m">${relChip(n)}<span>${esc(pathOf(n)[0].title)}</span><span>${esc(n.summary||'')}</span></div></div>`).join('');
    el.innerHTML=h;
  } else if(view==='changes'){
    if(!REVS.length && !SRV){ el.innerHTML=exportPanelHtml()+'<div class="empty">'+L.noHistory+'</div>'; bindExport(); return; }
    let srvPanel = '';
    if(SRV){
      srvPanel = `<div class="upd"><h3>${L.updTitle}</h3><div class="hint">${L.updHint}</div>
        <div class="btns"><button id="btnscan">1 · ${L.updScan}</button>
        <button id="btnrun" class="primary">2 · ${L.updRun}</button>
        <span class="spin" id="updspin"></span></div><pre id="updlog"></pre></div>`;
    }
    const nm = id => byId[id] ? esc(byId[id].title) : esc(id);
    const chip = id => byId[id] ? relChip(byId[id]) : `<span class="rel" style="--tc:var(--muted)">${esc(id)}</span>`;
    const stat = k => (STATUS[k]||[k])[0];
    let h=srvPanel+exportPanelHtml();
    const fresh = SEEN.add.size + SEEN.chg.size + SEEN.flips.length;
    h += `<div class="seen"><button id="markread" class="primary">${L.markRead}</button>`
      +  (fresh? `<button id="showchanged">${L.showChanged}</button>` : '')
      +  `<span style="color:var(--muted);font-size:12px">${fresh? L.badge(SEEN.add.size, SEEN.chg.size) : L.allRead} · rev${seenRev} → rev${CUR_REV}</span></div>`;
    if(fresh){

      if(SEEN.flips.length) h += `<div class="grp">${L.statusFlip}</div>` + SEEN.flips.map(f=>
        `<div class="flip">${chip(f.id)}<span>${stat(f.from)}</span><span class="ar">→</span><b>${stat(f.to)}</b></div>`).join('');
      if(SEEN.add.size) h += `<div class="grp">${L.newNodes} (${SEEN.add.size})</div><div>${[...SEEN.add].map(chip).join('')}</div>`;
      if(SEEN.chg.size) h += `<div class="grp">${L.updNodes} (${SEEN.chg.size})</div><div>${[...SEEN.chg].map(chip).join('')}</div>`;
      if(SEEN.gone.length) h += `<div class="grp">${L.removed}</div><div>${SEEN.gone.map(nm).join(', ')}</div>`;
      h += `</div>`;
    }
    if(REVS.length===1 && REVS[0].baseline) h += `<div class="empty" style="padding:20px">${L.noHistory}</div>`;
    REVS.slice().reverse().forEach(r=>{
      const cnt = r.baseline ? L.baseline : L.badge((r.added||[]).length, (r.changed||[]).length);
      h += `<details class="rev"><summary><h4>${L.revAt(r.rev, esc(r.at||''))}<span class="n">${cnt} · ${r.nodes} nodes</span></h4></summary>`;
      if(r.baseline){ h+='</details>'; return; }
      h += '<div class="body">';
      const flips=(r.changed||[]).filter(c=>c.fields && c.fields.status);
      if(flips.length) h += `<div class="grp">${L.statusFlip}</div>` + flips.map(c=>
        `<div class="flip">${chip(c.id)}<span>${stat(c.fields.status[0])}</span><span class="ar">→</span><b>${stat(c.fields.status[1])}</b></div>`).join('');
      if((r.added||[]).length) h += `<div class="grp">${L.newNodes}</div><div>${r.added.map(chip).join('')}</div>`;

  } else if(view==='sessions'){

      if(s.excluded) return `<tr class="ex"><td class="n">${esc(s.start.slice(0,10))}</td><td class="n">${esc(s.source||'')}</td><td><div>${esc(s.firstPrompt||'')}</div><div style="margin-top:4px"><span class="exbadge">${L.exReason}</span> <span style="font-size:12px;color:var(--muted)">${esc(s.excluded)}</span></div></td></tr>`;
      return `<tr><td class="n">${esc(s.start.slice(0,10))}<br>→ ${esc(s.end.slice(0,10))}</td><td class="n">${esc(s.source||'')}</td><td><div>${esc(s.firstPrompt||'')}</div><div style="font-size:12px;color:var(--muted)">${esc((s.cwd||'').replace(/^C:\\Users\\[^\\]+/,'~'))} · ${L.nPrompts(s.userPrompts)} · <a href="${fileUrl(s.digest)}" target="_blank">digest</a>${cmd?` · <code>${cmd}</code> <button class="cp" style="font-size:11px;padding:0 6px" onclick="rmCopy('${cmd}')">${L.copy}</button>`:''}</div><div style="margin-top:4px">${ns.map(relChip).join('')||`<span style="color:var(--muted);font-size:12px">${L.noLinked}</span>`}</div></td></tr>`; }).join('');
    el.innerHTML=`<table class="sess"><thead><tr><th>${L.colPeriod}</th><th>${L.colTool}</th><th>${L.colPrompt}</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
}
function setView(v){ view=v; const h=location.hash.replace(/&?view=[a-z]+/,''); location.hash=(h.replace('#','')?h+'&':'#')+'view='+v; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===v)); document.getElementById('stage').style.display = v==='map'?'':'none'; renderAll(); }

  if(ng){ s.insertAdjacentHTML('beforeend', `<span class="chip gapchip" id="gapchip" title="${L.gapTitle}"><i class="dot" style="background:var(--s-warn)"></i>${L.gapsOn} ${ng}</span>`);
    document.getElementById('gapchip').onclick=e=>{ gapsOn=!gapsOn; e.currentTarget.classList.toggle('on',gapsOn); renderAll(); }; }
  t.onclick=e=>{const c=e.target.closest('.chip'); if(!c)return; const k=c.dataset.type; typeOff.has(k)?typeOff.delete(k):typeOff.add(k); c.classList.toggle('off'); renderAll();};

// ---- events
(function(){
  const stage=document.getElementById('stage'); let drag=null;
  stage.addEventListener('mousedown',e=>{ if(e.target.closest('.node')||e.target.closest('button'))return; drag={x:e.clientX,y:e.clientY,tx,ty}; stage.classList.add('dragging'); });

  window.addEventListener('mouseup',()=>{ if(drag){drag=null; stage.classList.remove('dragging'); save();} });
  stage.addEventListener('wheel',e=>{ e.preventDefault(); const r=stage.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top; const f=e.deltaY<0?1.1:1/1.1; const ns=Math.min(2.5,Math.max(.2,scale*f)); tx = mx-(mx-tx)*ns/scale; ty=my-(my-ty)*ns/scale; scale=ns; document.getElementById('world').style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; save(); },{passive:false});
  stage.addEventListener('click',e=>{ const tg=e.target.closest('.tg'); if(tg){ const id=tg.dataset.tg; collapsed.has(id)?collapsed.delete(id):collapsed.add(id); save(); renderMap(); return; } const nd=e.target.closest('.node'); if(nd){ if(nd.dataset.id==='__root'){ selected=null; renderAll(); return;} const nn=byId[nd.dataset.id]; if(nn && nn.children.length && collapsed.has(nn.id)) collapsed.delete(nn.id); select(nd.dataset.id); } });
  stage.addEventListener('dblclick',e=>{ const nd=e.target.closest('.node'); if(nd && byId[nd.dataset.id] && byId[nd.dataset.id].children.length){ const id=nd.dataset.id; collapsed.has(id)?collapsed.delete(id):collapsed.add(id); save(); renderMap(); } });
  document.getElementById('zoom').onclick=e=>{ const b=e.target.closest('button'); if(!b)return; const r=stage.getBoundingClientRect(); const mx=r.width/2,my=r.height/2; const f=b.dataset.z==='1'?1.2:1/1.2; const ns=Math.min(2.5,Math.max(.2,scale*f)); tx=mx-(mx-tx)*ns/scale; ty=my-(my-ty)*ns/scale; scale=ns; renderMap(); save(); };
  document.getElementById('fit').onclick=fit;
  document.getElementById('expandAll').onclick=()=>{ collapsed.clear(); focusChanged=false; save(); renderMap(); };
  document.getElementById('collapseAll').onclick=()=>{ nodes.forEach(n=>{ if(n.depth>=1&&n.children.length) collapsed.add(n.id); }); focusChanged=false; save(); renderMap(); };
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  const q=document.getElementById('q'); let t; q.addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(()=>{ query=q.value.trim(); if(query){ nodes.filter(matches).forEach(expandTo);} renderAll(); },200); });
  q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const m=nodes.filter(matches); if(m.length){ select(m[0].id,{goMap:view==='map',center:true}); } } if(e.key==='Escape'){ q.value=''; query=''; renderAll(); } });
  window.addEventListener('keydown',e=>{ if(e.key==='Escape' && document.activeElement!==q){ clearFocus(); selected=null; renderAll(); } if(e.key==='/' && document.activeElement!==q){ e.preventDefault(); q.focus(); } });
  window.addEventListener('resize',()=>{ if(view==='map') renderMap(); });
  window.addEventListener('hashchange',()=>{            // deep links must work on an open page too
    const h=location.hash;
    const v=h.match(/view=(map|timeline|open|sessions|changes)/);
    if(v && v[1]!==view) setView(v[1]);
    const n=h.match(/node=([^&]+)/);
    if(n){ const id=decodeURIComponent(n[1]); if(byId[id] && id!==selected) select(id,{center:true}); }
  });
})();

// ---- init
document.getElementById('title').textContent = D.map.title || L.mapTitle;
document.title = D.map.title || L.mapTitle;
document.getElementById('meta').textContent = `${L.nNodes(nodes.length)} · ${L.nSess(sessions.filter(s=>!s.excluded).length)} · ${L.madeAt(D.generatedAt||'')}`;
chips();
(function(){ const set=(sel,txt,tip)=>{const e=document.querySelector(sel); if(e){e.textContent=txt; if(tip)e.title=tip;}};
  set('.tab[data-view=map]',L.map); set('.tab[data-view=timeline]',L.timeline);
  set('.tab[data-view=open]',L.open); set('.tab[data-view=sessions]',L.sessions);
  set('.tab[data-view=changes]',L.changes);
  document.getElementById('q').placeholder=L.searchPh;
  set('#expandAll',L.expand,L.expandT); set('#collapseAll',L.collapse,L.collapseT); set('#fit',L.fit,L.fitT);
})();
const hash = location.hash.match(/node=([^&]+)/);
if(hash && byId[decodeURIComponent(hash[1])]){ selected=decodeURIComponent(hash[1]); expandTo(byId[selected]); }
else if(store.selected && byId[store.selected]) selected=store.selected;
const hv = location.hash.match(/view=(map|timeline|open|sessions|changes)/); if(hv){ view=hv[1]; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===view)); document.getElementById('stage').style.display = view==='map'?'':'none'; }
if(store.tx==null) fit(); else renderAll();
if(selected && store.tx==null){ layout(); centerOn(byId[selected]); renderAll(); }
})();
</script>
</body>
</html>
